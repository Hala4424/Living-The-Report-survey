<!doctype html>
<html lang="en"><head>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta charset="utf-8">
<title>Living the Report</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Concept: a calm, one-column questionnaire. Navy ink and teal, taken from the CyberReport prototype; a book serif for the story, a plain sans for questions. */
:root{
  --bg:#f3f5fa; --card:#ffffff; --ink:#0c1a4a; --text:#1f2a44; --mute:#5a6684; --line:#dbe1ee;
  --teal:#0a8a96; --teal-soft:#e0f4f6; --navy:#07145c; --amber:#b86e00; --amber-soft:#fff4de; --danger:#b3261e;
  --on-navy:#ffffff; --shadow:0 1px 2px rgba(7,20,92,.06),0 8px 24px rgba(7,20,92,.06);
  --serif:"Source Serif 4",Georgia,serif; --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1020; --card:#141b33; --ink:#e8edff; --text:#d5dcf2; --mute:#97a3c4; --line:#27325a;
  --teal:#3cc4d1; --teal-soft:#10303a; --navy:#2a3a8f; --amber:#f0b04a; --amber-soft:#2d2411; --danger:#ff8a80;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1020; --card:#141b33; --ink:#e8edff; --text:#d5dcf2; --mute:#97a3c4; --line:#27325a;
  --teal:#3cc4d1; --teal-soft:#10303a; --navy:#2a3a8f; --amber:#f0b04a; --amber-soft:#2d2411; --danger:#ff8a80;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:16px/1.55 var(--sans);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 10px;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top-in{max-width:780px;margin:0 auto}
.brand{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:13px;color:var(--mute)}
.brand b{color:var(--ink);font-weight:700;letter-spacing:.01em}
.bar{height:6px;background:var(--line);border-radius:99px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);width:0;transition:width .3s}
main{max-width:780px;margin:0 auto;padding-top:24px}
h1{font:600 clamp(24px,5vw,32px)/1.2 var(--serif);color:var(--ink);margin:0 0 18px;text-wrap:balance}
h2{font:600 17px/1.35 var(--sans);color:var(--ink);margin:0 0 8px}
.chap{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--teal);margin-bottom:6px}
.lead{font:400 18px/1.55 var(--serif);color:var(--ink)}
p{margin:0 0 12px}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.q.bad{border-color:var(--danger)}
.q h2 small{display:block;font:400 13px/1.4 var(--sans);color:var(--mute);margin-top:3px}
.err{color:var(--danger);font-size:13px;margin-top:8px}
.note{background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 40%,transparent);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:15px}
ul{margin:0 0 12px;padding-left:20px}li{margin-bottom:4px}
.story{display:grid;grid-template-columns:1fr;gap:0;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:18px;box-shadow:var(--shadow)}
.story img{display:block;width:100%;max-height:320px;object-fit:contain;background:#dfeaf8}
.story .tx{padding:18px 20px}
.story .tx p{font:400 20px/1.5 var(--serif);color:var(--ink);margin:0}
.story .tx em{display:block;margin-top:10px;font-size:13px;color:var(--mute)}
@media(min-width:700px){.story{grid-template-columns:1.1fr 1fr}.story img{max-height:none;height:100%;object-fit:cover}}
.shots{display:grid;gap:14px;margin:0 0 16px;grid-template-columns:1fr}
@media(min-width:700px){.shots.n2{grid-template-columns:1fr 1fr}.shots.n3{grid-template-columns:repeat(3,1fr)}}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
figure img{display:block;width:100%;height:auto;cursor:zoom-in}
figure.phone{max-width:300px;margin-inline:auto;background:transparent;border:0;box-shadow:none}
figure figcaption{padding:8px 12px;font-size:13px;color:var(--mute);border-top:1px solid var(--line)}
figure.phone figcaption{border:0;text-align:center}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--amber);background:var(--amber-soft);border-radius:99px;padding:3px 9px;margin-bottom:8px}
/* likert */
.li{padding:12px 0;border-top:1px solid var(--line)}
.li:first-of-type{border-top:0;padding-top:4px}
.li.bad{background:color-mix(in srgb,var(--danger) 8%,transparent);border-radius:8px}
.li .txt{margin-bottom:8px}
.sc{display:flex;gap:6px}
.sc button{flex:1;min-width:0;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 15px var(--sans);cursor:pointer}
.sc button:hover{border-color:var(--teal)}
.sc button[aria-checked="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:4px}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
/* options */
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;background:var(--card);width:100%;text-align:left;font:inherit;color:inherit}
.opt:hover{border-color:var(--teal)}
.opt .mk{flex:none;width:20px;height:20px;border:2px solid var(--mute);border-radius:50%;margin-top:2px;position:relative}
.opt.multi .mk{border-radius:5px}
.opt[aria-checked="true"]{border-color:var(--teal);background:var(--teal-soft)}
.opt[aria-checked="true"] .mk{border-color:var(--teal);background:var(--teal)}
.opt[aria-checked="true"] .mk::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
textarea{width:100%;font:inherit;color:var(--text);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px;resize:vertical;min-height:90px}
/* buttons */
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:22px}
.btn{font:600 16px var(--sans);padding:13px 24px;border-radius:12px;border:1.5px solid var(--navy);background:var(--navy);color:var(--on-navy);cursor:pointer}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:9px 16px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* chat */
.chat{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px}
.chat header{background:var(--navy);color:#fff;padding:12px 16px}
.chat header b{display:block;font-size:16px}.chat header small{color:#b7e8ee;font-size:12px}
.chat .log{padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg);min-height:120px}
.bot,.usr{max-width:88%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.45}
.bot{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.usr{background:var(--teal);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;font-weight:600}
.chat .rep{padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line);background:var(--card)}
.chip{border:1.5px solid var(--teal);color:var(--teal);background:transparent;border-radius:99px;padding:8px 14px;font:600 14px var(--sans);cursor:pointer}
.chip:hover{background:var(--teal-soft)}
.sumcard{background:var(--card);border:1px solid var(--teal);border-radius:12px;padding:12px 14px}
.sumcard h3{margin:0 0 6px;font-size:15px;color:var(--ink)}
.sumcard ul{margin:6px 0 8px}
.fine{font-size:12.5px;color:var(--mute)}
/* personas */
.pgrid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px}
@media(min-width:640px){.pgrid{grid-template-columns:1fr 1fr}}
.pc{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit}
.pc img{display:block;width:100%;height:auto;border-bottom:1px solid var(--line)}
.pc .b{padding:10px 12px}.pc b{display:block;color:var(--ink)}.pc small{color:var(--mute)}
.pc[aria-checked="true"]{border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 30%,transparent)}
.sug{display:inline-block;font-size:11px;font-weight:700;color:var(--teal);background:var(--teal-soft);border-radius:99px;padding:2px 8px;margin-top:4px}
.sw{display:flex;gap:10px;align-items:center;margin:8px 0 4px}
.avs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.av{border:2px solid var(--line);border-radius:16px;background:var(--card);padding:10px;cursor:pointer}
.av img{display:block;width:100%;height:auto;border-radius:50%}
.av[aria-checked="true"]{border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 30%,transparent)}
/* lightbox */
.lb{position:fixed;inset:0;background:rgba(5,8,25,.88);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:8px;background:#fff}
.saved{font-size:12px;color:var(--mute)}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.res{overflow-x:auto}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script src="config.js"></script>
</head><body>
<div class="top"><div class="top-in"><div class="brand"><b>Living the Report</b><span id="chlabel"></span></div><div class="bar"><i id="pb"></i></div></div></div>
<main id="app" aria-live="polite"><p>Loading…</p></main>

<script>
(async function () {
  var app = document.getElementById('app');
  var SURVEY, A = {}, T = {}, idx = 0, uid = null, saveState = 'local', started = Date.now(), blockStart = Date.now();
  var LS = 'living-report-v1';
  function lsGet() { try { return JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) { return null; } }
  function lsSet() { try { localStorage.setItem(LS, JSON.stringify({ uid: uid, a: A, t: T, idx: idx, started: started })); } catch (e) {} }
  function $(h) { var d = document.createElement('div'); d.innerHTML = h; return d.firstElementChild; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  try { SURVEY = await (await fetch('survey.json')).json(); } catch (e) { app.innerHTML = '<p>The survey could not be loaded.</p>'; return; }
  var ENDPOINT = (window.SURVEY_ENDPOINT || '').trim();
  var saved = lsGet();
  if (saved) { A = saved.a || {}; T = saved.t || {}; idx = saved.idx || 0; started = saved.started || started; uid = uid || saved.uid; }
  uid = uid || 'p' + Math.random().toString(36).slice(2, 10);

  /* ---------- helpers ---------- */
  function cond(c) {
    if (!c) return true; var v = A[c.q];
    if (c.eq !== undefined) return v === c.eq;
    if (c.in) return c.in.indexOf(v) >= 0;
    return true;
  }
  function visible(b) { return cond(b.showIf); }
  function visBlocks() { return SURVEY.blocks.filter(visible); }
  function flat(items, out) { (items || []).forEach(function (it) { if (it.t === 'cond') { if (cond(it.if)) flat(it.items, out); } else out.push(it); }); return out; }
  function calc() { A.pathEff = A.path_force || A.path || A.pathEff; }

  async function save(done) {
    lsSet();
    if (!ENDPOINT) return;
    var doc = { pid: uid, v: SURVEY.version, started: started, updated: Date.now(), done: !!done, path: A.pathEff || null, a: A, t: T };
    try { await fetch(ENDPOINT, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(doc) }); saveState = 'cloud'; } catch (e) { saveState = 'local'; }
  }

  /* ---------- renderers ---------- */
  function figure(f) {
    var el = $('<figure class="' + (f.phone ? 'phone' : '') + '"><img src="img/' + f.f + '" alt="' + esc(f.cap) + '" loading="lazy"><figcaption>' + esc(f.cap) + '</figcaption></figure>');
    el.querySelector('img').addEventListener('click', function () {
      var lb = $('<div class="lb" role="dialog" aria-label="Enlarged screen"><img src="img/' + f.f + '" alt="' + esc(f.cap) + '"></div>');
      lb.addEventListener('click', function () { lb.remove(); }); document.body.appendChild(lb);
    });
    return el;
  }
  function rShot(it) {
    var w = document.createElement('div');
    if (it.concept) w.appendChild($('<span class="tag">' + esc(it.concept) + '</span>'));
    var g = $('<div class="shots n' + it.files.length + '"></div>');
    it.files.forEach(function (f) { g.appendChild(figure(f)); });
    w.appendChild(g); return w;
  }
  function qWrap(it, extra) {
    var el = $('<section class="q" data-id="' + it.id + '"><h2>' + esc(it.prompt) + (it.note ? '<small>' + esc(it.note) + '</small>' : '') + '</h2></section>');
    return el;
  }
  function rLikert(it) {
    var el = qWrap(it), n = it.n || 7;
    var lo = it.lo || (n === 5 ? 'Disagree strongly' : 'Strongly disagree'), hi = it.hi || (n === 5 ? 'Agree strongly' : 'Strongly agree');
    it.items.forEach(function (x) {
      var row = $('<div class="li" data-item="' + x.id + '"><div class="txt">' + esc(x.text) + '</div><div class="sc" role="radiogroup" aria-label="' + esc(x.text) + '"></div><div class="ends"><span>' + esc(lo) + '</span><span>' + esc(hi) + '</span></div></div>');
      var sc = row.querySelector('.sc');
      for (var k = 1; k <= n; k++) (function (k) {
        var b = $('<button type="button" role="radio" aria-checked="' + (A[x.id] === k) + '" aria-label="' + k + '">' + k + '</button>');
        b.addEventListener('click', function () { A[x.id] = k; sc.querySelectorAll('button').forEach(function (o, i) { o.setAttribute('aria-checked', String(i + 1 === k)); }); row.classList.remove('bad'); lsSet(); });
        sc.appendChild(b);
      })(k);
      el.appendChild(row);
    });
    return el;
  }
  function rOpts(it, multi) {
    var el = qWrap(it);
    var list = document.createElement('div');
    function sel(v) { return multi ? (A[it.id] || []).indexOf(v) >= 0 : A[it.id] === v; }
    function refresh() { list.querySelectorAll('.opt').forEach(function (b) { b.setAttribute('aria-checked', String(sel(b.dataset.v))); }); }
    it.options.forEach(function (o) {
      var b = $('<button type="button" class="opt ' + (multi ? 'multi' : '') + '" role="' + (multi ? 'checkbox' : 'radio') + '" data-v="' + esc(o.v) + '" aria-checked="' + sel(o.v) + '"><span class="mk"></span><span>' + esc(o.l) + '</span></button>');
      b.addEventListener('click', function () {
        if (multi) {
          var cur = (A[it.id] || []).slice(), i = cur.indexOf(o.v);
          if (i >= 0) cur.splice(i, 1); else { if (it.max && cur.length >= it.max) cur.shift(); cur.push(o.v); }
          A[it.id] = cur;
        } else A[it.id] = o.v;
        refresh(); el.classList.remove('bad'); lsSet();
      });
      list.appendChild(b);
    });
    el.appendChild(list); return el;
  }
  function rOpen(it) {
    var el = qWrap(it);
    var ta = document.createElement('textarea'); ta.rows = it.rows || 3; ta.id = 'ta_' + it.id; ta.value = A[it.id] || ''; ta.setAttribute('aria-label', it.prompt);
    ta.placeholder = 'Optional'; ta.addEventListener('input', function () { A[it.id] = ta.value; lsSet(); });
    el.appendChild(ta); return el;
  }

  /* ---------- components ---------- */
  var COMP = {};
  COMP.avatar = function () {
    var el = $('<section class="q" data-need="avatar"><h2>Choose the figure that feels most like you</h2><div class="avs"></div></section>');
    var g = el.querySelector('.avs');
    ['av1', 'av2', 'av3'].forEach(function (k) {
      var b = $('<button type="button" class="av" role="radio" aria-checked="' + (A.avatar === k) + '" aria-label="Avatar ' + k.slice(2) + '"><img src="img/' + k + '.png" alt=""></button>');
      b.addEventListener('click', function () { A.avatar = k; g.querySelectorAll('.av').forEach(function (o) { o.setAttribute('aria-checked', 'false'); }); b.setAttribute('aria-checked', 'true'); el.classList.remove('bad'); lsSet(); });
      g.appendChild(b);
    });
    el.need = function () { return !!A.avatar; }; return el;
  };

  COMP.reportmate = function () {
    var el = $('<section class="chat" data-need="rm"><header><b>ReportMate</b><small>Private. Nothing here is added to a report.</small></header><div class="log"></div><div class="rep"></div></section>');
    var log = el.querySelector('.log'), rep = el.querySelector('.rep');
    var turns = [
      { bot: 'Hi, I’m ReportMate. I can help you work out whether to report, but I will not decide for you. What happened?', key: 'rm_t1', opts: ['I got a suspicious message and tapped the link', 'I’m not sure what happened'] },
      { bot: 'Thank you. Which details did you enter on the page, if any? (Don’t type them here.)', key: 'rm_t2', opts: ['Card details', 'A password', 'Personal details', 'Nothing'] },
      { bot: 'Has any money left your account?', key: 'rm_t3', opts: ['No', 'Yes', 'I’m not sure'] },
    ];
    function bot(h) { log.appendChild($('<div class="bot">' + h + '</div>')); }
    function usr(t) { log.appendChild($('<div class="usr">' + esc(t) + '</div>')); }
    function chips(list, fn) { rep.innerHTML = ''; list.forEach(function (t) { var b = $('<button type="button" class="chip">' + esc(t) + '</button>'); b.addEventListener('click', function () { fn(t); }); rep.appendChild(b); }); }
    function summary() {
      var n = (A.rm_t2 || '').toLowerCase(), money = A.rm_t3 === 'Yes';
      var head = A.rm_t2 === 'Nothing' ? 'Reporting is optional here' : 'This looks like a likely phishing attempt';
      var why = A.rm_t2 === 'Nothing' ? 'You did not enter any details, so the risk is lower. Reporting can still help the team protect other people, and it leaves a record if something happens later.' : 'Because you entered ' + esc(n) + ', reporting is worthwhile even without a loss.';
      var urgent = money ? '<b>Call your bank now.</b> Money that has already left your account is urgent.' : 'Call your bank to block or check your card.';
      bot('<div class="sumcard"><h3>' + head + '</h3><p>' + why + '</p><p>' + urgent + '</p><b>Useful to include</b><ul><li>Screenshots of both messages</li><li>The link (do not tap it again)</li><li>The time you tapped it</li><li>What you typed (not the numbers)</li></ul><div class="fine">ReportMate does not give legal advice and never asks for card numbers.</div></div>');
      choose();
    }
    function choose() {
      chips(['Start my report', 'I’m still not sure', 'Not now'], function (t) {
        usr(t);
        if (t === 'I’m still not sure') { A.rm_unsure_n = (A.rm_unsure_n || 0) + 1; bot('That is okay. Reporting helps the team spot scam patterns and protect other people, and you can stop at any time. You can also come back to this later.'); choose(); }
        else { A.rm_final = t; rep.innerHTML = '<span class="fine">Thank you. Continue when you are ready.</span>'; el.classList.remove('bad'); }
        lsSet(); log.scrollTop = log.scrollHeight;
      });
    }
    function step(i) {
      if (i >= turns.length) return summary();
      var tn = turns[i]; bot(esc(tn.bot));
      chips(tn.opts, function (t) { A[tn.key] = t; usr(t); lsSet(); step(i + 1); });
    }
    if (A.rm_final) { turns.forEach(function (tn) { bot(esc(tn.bot)); usr(A[tn.key] || ''); }); summary(); usr(A.rm_final); rep.innerHTML = '<span class="fine">Thank you. Continue when you are ready.</span>'; }
    else step(0);
    el.need = function () { return !!A.rm_final; }; return el;
  };

  var Q4 = [
    { k: 'fq_barrier', multi: true, t: 'What would make reporting difficult for you?', o: [['privacy', 'I’m worried about who might find out.'], ['uncertainty', 'I’m not sure whether the incident is serious enough.'], ['time', 'I don’t have much time.'], ['writing', 'I don’t know how to explain what happened.'], ['direct', 'None of these. I prefer to report directly.']] },
    { k: 'fq_assist', multi: true, t: 'How would you prefer the system to help?', o: [['guided', 'Guide me through a few questions.'], ['suggestions', 'Suggest answers and let me edit them.'], ['self_directed', 'Let me complete the form myself.']] },
    { k: 'fq_detail', t: 'How much detail would you prefer?', o: [['minimal', 'As little as possible.'], ['detailed', 'A detailed form with explanations.'], ['decide_each_time', 'Let me decide each time.']] },
    { k: 'fq_conf', t: 'How sure are you that you would recognize something worth reporting?', o: [['high', 'Very sure.'], ['moderate', 'Somewhat sure.'], ['low', 'I’m often unsure.']] },
  ];
  COMP.fourq = function () {
    var el = $('<section class="q" data-need="fq"></section>');
    var step = 0;
    function draw() {
      el.innerHTML = '';
      if (A.fq_done) { el.appendChild($('<p><b>Your experience is ready.</b> CyberReport has adjusted the reporting experience to your preferences.</p>')); var r = $('<button type="button" class="btn sec sm">Answer again</button>'); r.addEventListener('click', function () { A.fq_done = 0; step = 0; draw(); }); el.appendChild(r); return; }
      var q = Q4[step];
      el.appendChild($('<div class="fine">Question ' + (step + 1) + ' of 4 · optional · about 30 seconds</div>'));
      el.appendChild($('<h2 style="margin-top:6px">' + esc(q.t) + '</h2>'));
      var cur = A[q.k];
      q.o.forEach(function (o) {
        var on = q.multi ? (cur || []).indexOf(o[0]) >= 0 : cur === o[0];
        var b = $('<button type="button" class="opt ' + (q.multi ? 'multi' : '') + '" role="' + (q.multi ? 'checkbox' : 'radio') + '" aria-checked="' + on + '"><span class="mk"></span><span>' + esc(o[1]) + '</span></button>');
        b.addEventListener('click', function () {

          else A[q.k] = o[0];

        });
        el.appendChild(b);
      });
      var nav = $('<div class="nav"></div>');
      var back = $('<button type="button" class="btn sec sm">Back</button>'); back.disabled = step === 0; back.addEventListener('click', function () { step--; draw(); });
      var skip = $('<button type="button" class="btn sec sm">Skip</button>'); skip.addEventListener('click', function () { if (A[q.k] === undefined) A[q.k] = q.multi ? [] : 'skipped'; adv(); });
      var next = $('<button type="button" class="btn sm">' + (step === 3 ? 'Customize my experience' : 'Continue') + '</button>'); next.addEventListener('click', adv);
      function adv() { if (step < 3) { step++; draw(); } else { A.fq_done = 1; lsSet(); el.classList.remove('bad'); draw(); } }
      nav.appendChild(back); var rt = document.createElement('div'); rt.style.display = 'flex'; rt.style.gap = '8px'; rt.appendChild(skip); rt.appendChild(next); nav.appendChild(rt);
      el.appendChild(nav);
    }
    draw();
    el.need = function () { return !!A.fq_done; }; return el;
  };

  var PERS = [
    { v: 'reassure', n: 'Take it slowly and reassure me', d: 'One question at a time, calm wording, support shown first.', img: 'p_reassure.jpg' },
    { v: 'discreet', n: 'No judgment, keep it discreet', d: 'Blame-free wording and a private start.', img: 'p_discreet.jpg' },
    { v: 'privacy', n: 'Show me exactly what happens to my information', d: 'Privacy details open by default; every field says why it is asked.', img: 'p_privacy.jpg' },
    { v: 'verify', n: 'Let me stay in control and check for myself', d: 'Anonymous path first; who runs the service stated up front.', img: 'p_verify.jpg' },
    { v: 'quick', n: 'Keep it quick', d: 'Quick report by default, essentials only, save-draft in view.', img: 'p_quick.jpg' },
    { v: 'guided', n: 'Guide me step by step', d: 'Assistant first, plain-language types, writing help on.', img: 'p_guided.jpg' },
    { v: 'standard', n: 'No preference', d: 'The standard CyberReport screens.', img: 'p_standard.jpg' },
  ];
  function suggest() {
    var b = A.fq_barrier || [], conf = A.fq_conf, as = A.fq_assist || [];

  }

    if (onclick) b.addEventListener('click', onclick); return b;
  }
  COMP.persona = function () {
    var el = $('<section class="q" data-need="persona"></section>');
    if (!A.persona_sug) A.persona_sug = suggest();
    el.appendChild($('<h2>Pick the support style that fits you</h2>'));
    var g = $('<div class="pgrid"></div>');
    PERS.forEach(function (p) {
      var c = pcard(p, A.persona === p.v, A.persona_sug === p.v, function () { A.persona = p.v; g.querySelectorAll('.pc').forEach(function (o) { o.setAttribute('aria-checked', 'false'); }); c.setAttribute('aria-checked', 'true'); el.classList.remove('bad'); lsSet(); });
      g.appendChild(c);
    });
    el.appendChild(g);
    var sw = $('<label class="sw"><input type="checkbox" id="pv"' + (A.persona_values ? ' checked' : '') + '> <span>Add faith- and values-sensitive support (optional). It adjusts wording and the help list. You are never asked your religion.</span></label>');
    sw.querySelector('input').addEventListener('change', function (e) { A.persona_values = e.target.checked ? 1 : 0; lsSet(); });
    el.appendChild(sw);
    el.need = function () { return !!A.persona; }; return el;
  };
  COMP.persona_other = function () {
    var el = $('<section class="q"><h2>Now look at a different style</h2></section>');
    if (!A.persona_other) { var pool = PERS.filter(function (p) { return p.v !== A.persona && p.v !== 'standard'; }); A.persona_other = pool[Math.floor(Math.random() * pool.length)].v; lsSet(); }
    var p = PERS.filter(function (x) { return x.v === A.persona_other; })[0];
    el.appendChild($('<p class="fine">This is a style you did not choose.</p>'));
    var g = $('<div class="pgrid"></div>'); g.appendChild(pcard(p, false, false, null)); el.appendChild(g);
    el.need = function () { return true; }; return el;
  };

  COMP.writing = function () {
    var el = $('<section class="q" data-need="wa"></section>');
    var SUG = 'I received a message from a courier called Swift Parcel asking me to pay a redelivery fee. I tapped the link and entered my card details on the page. It showed an error. Nothing has been charged so far.';
    el.appendChild($('<h2>What happened? <small>Describe the incident in your own words. You do not need technical terms.</small></h2>'));
    var ta = $('<textarea id="wa_text" rows="3" aria-label="Describe what happened" placeholder="For example: I clicked a link in a message and put my card in…"></textarea>');
    ta.value = A.wa_text || ''; ta.addEventListener('input', function () { A.wa_text = ta.value; lsSet(); });
    el.appendChild(ta);
    var row = $('<div class="nav" style="margin-top:10px"></div>');
    var help = $('<button type="button" class="btn sm">Need help writing this?</button>');
    var own = $('<button type="button" class="btn sec sm">I would write it myself</button>');
    row.appendChild(help); row.appendChild(own); el.appendChild(row);
    var box = $('<div class="sumcard" hidden style="margin-top:12px"><h3>Suggested version (you stay in control)</h3><p id="wa_s"></p><div style="display:flex;gap:8px;flex-wrap:wrap"></div></div>');
    box.querySelector('#wa_s').textContent = SUG;
    var bb = box.lastElementChild;
    [['use', 'Use this'], ['edit', 'Edit it'], ['ignore', 'Ignore']].forEach(function (x) { var b = $('<button type="button" class="chip">' + x[1] + '</button>'); b.addEventListener('click', function () { A.wa_action = x[0]; if (x[0] !== 'ignore') { ta.value = SUG; A.wa_text = SUG; } if (x[0] === 'edit') ta.focus(); box.querySelector('h3').textContent = 'You chose: ' + x[1].toLowerCase(); el.classList.remove('bad'); lsSet(); }); bb.appendChild(b); });
    el.appendChild(box);
    help.addEventListener('click', function () { box.hidden = false; A.wa_asked = 1; lsSet(); });
    own.addEventListener('click', function () { A.wa_action = 'own'; el.classList.remove('bad'); own.textContent = 'You chose to write it yourself'; lsSet(); });
    el.appendChild($('<p class="fine" style="margin-top:10px">This suggestion is a scripted example, so every participant sees the same one.</p>'));
    el.need = function () { return !!A.wa_action; }; return el;
  };

  /* ---------- block rendering ---------- */
  function rItems(items, host, needs) {
    (items || []).forEach(function (it) {
      var el;
      if (it.t === 'cond') { if (cond(it.if)) rItems(it.items, host, needs); return; }
      if (it.t === 'text') el = $('<div>' + it.html + '</div>');
      else if (it.t === 'shot') el = rShot(it);
      else if (it.t === 'likert') el = rLikert(it);
      else if (it.t === 'single') el = rOpts(it, false);
      else if (it.t === 'multi') el = rOpts(it, true);
      else if (it.t === 'open') el = rOpen(it);
      else if (it.t === 'component') { el = COMP[it.name](); }
      host.appendChild(el); needs.push({ it: it, el: el });
    });
  }
  function missing(needs) {
    var first = null;
    needs.forEach(function (n) {
      var it = n.it, bad = false;
      if (it.t === 'likert') n.el.querySelectorAll('.li').forEach(function (r) { var id = r.dataset.item; var miss = A[id] === undefined; r.classList.toggle('bad', miss); if (miss) bad = true; });
      else if (it.t === 'single') bad = !it.opt && A[it.id] === undefined;
      else if (it.t === 'multi') bad = !it.opt && !(A[it.id] && A[it.id].length);
      else if (it.t === 'component' && n.el.need) bad = !n.el.need();
      if (bad) { n.el.classList.add('bad'); if (!first) first = n.el; } else if (n.el.classList) n.el.classList.remove('bad');
    });
    return first;
  }
  function end(msg) {
    app.innerHTML = '<h1>Thank you</h1><p class="lead">' + esc(msg) + '</p>'; document.getElementById('pb').style.width = '100%';
  }
  function render() {
    calc();
    var blocks = visBlocks();
    var b = SURVEY.blocks[idx];
    while (b && !visible(b)) { idx++; b = SURVEY.blocks[idx]; }
    if (!b) return finish();
    var pos = blocks.indexOf(b), tot = blocks.length;
    document.getElementById('pb').style.width = Math.round((pos / tot) * 100) + '%';
    document.getElementById('chlabel').textContent = b.ch;
    app.innerHTML = ''; window.scrollTo(0, 0);
    app.appendChild($('<div class="chap">' + esc(b.ch) + '</div>'));
    app.appendChild($('<h1>' + esc(b.title) + '</h1>'));
    if (b.story) {
      var s = $('<div class="story"><img src="img/' + b.story.img + '.png" alt=""><div class="tx"><p>' + b.story.text + '</p>' + (b.story.cap ? '<em>' + esc(b.story.cap) + '</em>' : '') + '</div></div>');
      app.appendChild(s);
    }
    var needs = [];
    rItems(b.items, app, needs);
    var nav = $('<div class="nav"></div>');
    var back = $('<button type="button" class="btn sec">Back</button>'); back.disabled = pos === 0;
    back.addEventListener('click', function () { var i = idx - 1; while (i > 0 && !visible(SURVEY.blocks[i])) i--; idx = Math.max(0, i); lsSet(); render(); });
    var next = $('<button type="button" class="btn">' + (pos === tot - 1 ? 'Finish' : 'Continue') + '</button>');
    var msg = $('<div class="err" hidden>Please answer the highlighted questions to continue.</div>');
    next.addEventListener('click', async function () {
      var f = missing(needs);
      if (f) { msg.hidden = false; f.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
      T[b.id] = (T[b.id] || 0) + (Date.now() - blockStart); blockStart = Date.now();
      if (b.endIf && A[b.endIf.q] === b.endIf.eq) { await save(false); return end(b.endIf.msg); }
      calc(); idx++; lsSet(); save(false); render();
    });
    nav.appendChild(back); nav.appendChild(next);
    app.appendChild(msg); app.appendChild(nav);
    blockStart = Date.now();
  }

  /* ---------- end + export ---------- */
  function flatIds() {
    var cols = [];
    SURVEY.blocks.forEach(function (b) { (function w(items) { (items || []).forEach(function (it) { if (it.t === 'cond') return w(it.items); if (it.t === 'likert') it.items.forEach(function (x) { cols.push(x.id); }); else if (it.t === 'single' || it.t === 'multi' || it.t === 'open') cols.push(it.id); }); })(b.items); });
    ['avatar', 'rm_t1', 'rm_t2', 'rm_t3', 'rm_final', 'rm_unsure_n', 'fq_barrier', 'fq_assist', 'fq_detail', 'fq_conf', 'persona_sug', 'persona', 'persona_values', 'persona_other', 'wa_text', 'wa_asked', 'wa_action', 'pathEff'].forEach(function (c) { if (cols.indexOf(c) < 0) cols.push(c); });
    return cols;
  }
  function csvCell(v) { if (v === undefined || v === null) return ''; if (Array.isArray(v)) v = v.join('|'); v = String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  function toCSV(rows) {
    var cols = flatIds(), head = ['pid', 'done', 'started', 'updated', 'minutes'].concat(cols);
    var out = [head.join(',')];
    rows.forEach(function (r) { var a = r.a || {}; var mins = r.t ? Math.round(Object.keys(r.t).reduce(function (s, k) { return s + r.t[k]; }, 0) / 600) / 100 : ''; out.push([r.pid, r.done ? 1 : 0, new Date(r.started).toISOString(), new Date(r.updated).toISOString(), mins].concat(cols.map(function (c) { return a[c]; })).map(csvCell).join(',')); });
    return out.join('\n');
  }
  async function offer(name, text) {
    try { var bl = new Blob([text], { type: 'text/csv' }), u = URL.createObjectURL(bl), l = document.createElement('a'); l.href = u; l.download = name; document.body.appendChild(l); l.click(); l.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 2000); return true; } catch (e) {}
    var box = $('<div class="q"><h2>Copy your file</h2><textarea rows="8" readonly></textarea></div>'); box.querySelector('textarea').value = text; app.appendChild(box); box.querySelector('textarea').select(); return false;
  }
  async function finish() {
    document.getElementById('pb').style.width = '100%'; document.getElementById('chlabel').textContent = 'Debrief';
    T.total = Date.now() - started; await save(true);
    app.innerHTML = '';
    app.appendChild($('<h1>Thank you for taking part</h1>'));
    app.appendChild($('<div class="q"><h2>What was simulated</h2><ul><li>The story, the courier, CyberReport and the helpline were made up. No report was sent.</li><li>ReportMate, the writing help and the reminders were scripted. Nothing on your phone was scanned.</li><li>The reminder messages used wording we wrote for the study. The “80%” figure and the 24-hour draft deletion are <b>not real</b>.</li><li>Real services often cannot investigate every report or recover money. The status screens showed a prototype.</li></ul></div>'));
    app.appendChild($('<div class="q"><h2>If this was difficult</h2><p>If you have been targeted by fraud, help is available. Fraud helpline (demo): <b>000 000 0000</b>. This is a fictional number. The research team will list local support services for Qatar and the UK here before the study runs.</p></div>'));
    var st = $('<p class="saved"></p>'); st.textContent = saveState === 'cloud' ? 'Your answers were sent to the research team. Thank you.' : 'Your answers could not be sent. Please download a copy below and send it to the research team.'; app.appendChild(st);
    var d = $('<button type="button" class="btn sec">Download my answers</button>');
    d.addEventListener('click', function () { offer('living-the-report-' + uid + '.csv', toCSV([{ pid: uid, done: true, started: started, updated: Date.now(), a: A, t: T }])); });
    app.appendChild(d);
    try { localStorage.removeItem(LS); } catch (e) {}
  }
  render();
})();
